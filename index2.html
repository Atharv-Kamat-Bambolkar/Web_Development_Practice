<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            background-color: blue;
            padding: 10px;
        }
        span {
            background-color: yellow;
            color: blue;
            padding: 10px;
        }
        p.example1 { display: none; }
        p.example2 { display: block; }
        p.example3 { display: inline; }
        p.example4 {
            visibility: hidden; 
            /* display: inline-block;  */
        }
        p.example5 { display: flex; }
        p.example6 { display: grid; }
    </style>
</head>
<body>
    <h1>The Display Property</h1>
    <h2>Display: none:</h2>
    <p class="example1">
        <span>TEXT 1</span>
        <span>TEXT 2</span>
        <span>TEXT 3</span>
    </p>
    <h2>Display: block:</h2>
    <p class="example2">
        <span>TEXT 1</span>
        <span>TEXT 2</span>
        <span>TEXT 3</span>
    </p>
    <h2>Display: inline:</h2>
    <p class="example3">
        <span>TEXT 1</span>
        <span>TEXT 2</span>
        <span>TEXT 3</span>
    </p>
    <h2>Display: inline-block:</h2>
    <p class="example4">
        <span>TEXT 1</span>
        <span>TEXT 2</span>
        <span>TEXT 3</span>
    </p>
    <h2>Display: flex:</h2>
    <p class="example5">
        <span>TEXT 1</span>
        <span>TEXT 2</span>
        <span>TEXT 3</span>
    </p>
    <h2>Display: grid:</h2>
    <p class="example6">
        <span>TEXT 1</span>
        <span>TEXT 2</span>
        <span>TEXT 3</span>
    </p>
</body>
</html>

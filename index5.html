<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>column-gap Property</title>
    <style>
        .container {
            display: grid;
            height: 500px;
            /* column-gap: 50px;
            row-gap: 50px; */
            gap: 5px;
            grid-template-columns: 70px 70px 70px;
            background-color: dodgerblue;
            padding: 5px;
            place-content: center;
        }

        .container div {
            background-color: #f1f1f1;
            color: #000;
            /* border: 1px solid black; */
            padding: 10px;
            font-size: 30px;
            text-align: center;
        }

        .item1 { 
            /* grid-column-start: 1;
            grid-column-end: 2; */
            /* grid-row-start: 1;
            grid-row-end: 3; */
            grid-column: 1 / span 2;
            /* grid-row: 1 / span 2; */
        }

        .item2 { 
            grid-row: 1 / span 2;
            /* grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 1; 
            grid-row-end: 2;  */
        }
    </style>
</head>
<body>
    <h1>The column-gap Property</h1>
    <p>Use the <em>column-gap</em> 
        property to adjust the space between the grid columns:</p>
    <div class="container">
        <div class="item1">1</div>
        <div class="item2">2</div>
        <div class="item3">3</div>
        <div class="item4">4</div>
        <div class="item5">5</div>
    </div>
</body>
</html>
